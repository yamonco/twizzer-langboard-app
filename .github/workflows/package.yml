name: package
on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_package.py
      - run: python3 scripts/build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: goldenbase-langboard-app
          path: dist/goldenbase-0.1.0.zip
